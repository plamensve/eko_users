{% extends 'base.html' %}

{% block title %}Моят профил · GTA Manager{% endblock %}

{% block content %}
<div class="mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    <h4 class="mb-0">Моят профил</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Потребителско име</label>
                                    <input type="text" class="form-control" value="{{ user.username }}" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Имейл</label>
                                    <input type="email" name="email" class="form-control" value="{{ user.email }}">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Име</label>
                                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Фамилия</label>
                                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Обнови информацията</button>
                            <a href="{% url 'change_password' %}" class="btn btn-warning">Смяна на парола</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
