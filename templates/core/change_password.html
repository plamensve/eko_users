{% extends 'base.html' %}

{% block title %}Смяна на парола - EKO Система{% endblock %}

{% block content %}
<div class="mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Смяна на парола</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group">
                                <label>{{ field.label }}</label>
                                <div class="input-group">
                                    {{ field }}
                                </div>
                                {% for error in field.errors %}
                                    <div class="text-danger small">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div class="mt-4">
                            <button type="submit" class="btn btn-warning">Промени паролата</button>
                            <a href="{% url 'profile' %}" class="btn btn-secondary">Назад към профила</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
