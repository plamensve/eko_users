{% extends 'base.html' %}
{% block title %}Вход · EKO Manager{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-brand"><span class="brand-mark fs-4"><i class="bi bi-fuel-pump-fill"></i></span><h1 class="h3 fw-bold mt-3">EKO Manager</h1><p class="text-muted">Защитен достъп до клиентските отчети</p></div>
  <section class="surface"><div class="surface-body p-4 p-lg-5">
    {% if form.errors %}<div class="alert alert-danger">Невалидно потребителско име или парола.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label fw-semibold" for="id_username">Потребителско име</label><input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus></div>
      <div class="mb-4"><label class="form-label fw-semibold" for="id_password">Парола</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Вход в системата</button>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    </form>
  </div></section>
</div>
{% endblock %}
