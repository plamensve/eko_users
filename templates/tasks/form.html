{% extends 'base.html' %}
{% block title %}{{ heading }} · GTA Manager{% endblock %}
{% block content %}<div class="tasks-shell"><a href="{{ back_url }}" class="tasks-back"><i class="bi bi-arrow-left"></i> Назад</a><div class="tasks-panel task-form-panel"><h1>{{ heading }}</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-success" type="submit">Запази</button></form></div></div>{% endblock %}
